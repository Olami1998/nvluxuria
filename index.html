
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#25D366;--green-dark:#128C7E;--bg:#f7f6f2;--card:#fff;--border:#e5e3dc;--text:#1a1a18;--muted:#8a8880;--accent:#ff6b35;--radius:14px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
.store{max-width:960px;margin:0 auto;padding:1rem 1rem 4rem}
.header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0 1.5rem;border-bottom:1.5px solid var(--border);margin-bottom:2rem}
.brand{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:-0.03em}
.brand span{color:var(--accent)}
.cart-btn{display:flex;align-items:center;gap:8px;background:var(--text);color:#fff;border:none;padding:10px 20px;border-radius:50px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:transform 0.15s,background 0.15s}
.cart-btn:hover{background:#333;transform:scale(1.02)}
.cart-count{background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;min-width:20px}
.section-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1.1rem;margin-bottom:1.25rem;letter-spacing:-0.01em}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem;margin-bottom:2.5rem}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:box-shadow 0.2s,transform 0.2s;cursor:default}
.product-card:hover{box-shadow:0 8px 28px rgba(0,0,0,0.09);transform:translateY(-3px)}
.product-img-wrap{width:100%;height:170px;overflow:hidden;background:#f0ede6;position:relative}
.product-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s}
.product-card:hover .product-img-wrap img{transform:scale(1.04)}
.product-img-wrap .fallback-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4rem}
.product-info{padding:12px 14px 14px}
.product-name{font-family:'Syne',sans-serif;font-weight:600;font-size:14px;margin-bottom:4px;letter-spacing:-0.01em}
.product-price{color:var(--accent);font-weight:700;font-size:15px;margin-bottom:10px}
.add-btn{width:100%;background:var(--text);color:#fff;border:none;padding:9px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:background 0.15s,transform 0.1s}
.add-btn:hover{background:#333}
.add-btn:active{transform:scale(0.97)}
.add-btn.added{background:var(--green-dark)}

/* Cart panel */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.38);z-index:99}
.overlay.open{display:block}
.cart-panel{display:none;position:fixed;top:0;right:0;height:100%;width:min(400px,100vw);background:var(--card);border-left:1px solid var(--border);z-index:100;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,0.12)}
.cart-panel.open{display:flex}
.cart-header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem;border-bottom:1px solid var(--border)}
.cart-header h3{font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem}
.close-btn{background:none;border:1px solid var(--border);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background 0.15s}
.close-btn:hover{background:var(--bg)}
.cart-body{flex:1;overflow-y:auto;padding:1rem 1.25rem}
.cart-empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.cart-empty .ei{font-size:3rem;margin-bottom:0.75rem}
.cart-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.cart-item:last-child{border-bottom:none}
.ci-img{width:54px;height:54px;border-radius:8px;overflow:hidden;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.ci-img img{width:100%;height:100%;object-fit:cover}
.ci-details{flex:1;min-width:0}
.ci-name{font-weight:500;font-size:14px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-price{color:var(--accent);font-size:13px;font-weight:600}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty-btn{background:var(--bg);border:1px solid var(--border);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background 0.1s}
.qty-btn:hover{background:var(--border)}
.qty-num{font-size:13px;font-weight:600;min-width:18px;text-align:center}
.remove-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px;transition:color 0.15s;flex-shrink:0}
.remove-btn:hover{color:#e24b4a}

/* Customer form */
.form-section{padding:1rem 1.25rem;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.form-section h4{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0.03em;text-transform:uppercase}
.field input,.field textarea,.field select{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color 0.15s;resize:none}
.field input:focus,.field textarea:focus{border-color:#aaa}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:0.7}

/* Footer */
.cart-footer{padding:1rem 1.25rem}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.total-label{color:var(--muted);font-size:14px}
.total-price{font-family:'Syne',sans-serif;font-weight:700;font-size:1.35rem}
.wa-btn{width:100%;background:var(--green);color:#fff;border:none;padding:14px;border-radius:12px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background 0.15s,transform 0.1s}
.wa-btn:hover{background:var(--green-dark)}
.wa-btn:active{transform:scale(0.98)}
.wa-icon{width:22px;height:22px;fill:#fff;flex-shrink:0}
.phone-note{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
.err-msg{font-size:11px;color:#e24b4a;margin-top:2px;display:none}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:#fff;padding:10px 20px;border-radius:50px;font-size:13px;font-weight:500;transition:transform 0.3s;z-index:200;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>

<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">QuickShop — WhatsApp ecommerce store</h2>

<div class="store">
  <div class="header">
    <div class="brand">NV<span>Luxuria</span></div>
    <button class="cart-btn" onclick="openCart()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Cart <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
  <div class="section-title">Featured Products</div>
  <div class="products" id="productsGrid"></div>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>

<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h3>Your Order</h3>
    <button class="close-btn" onclick="closeCart()">&#x2715;</button>
  </div>

  <div class="cart-body" id="cartBody">
    <div class="cart-empty"><div class="ei"></div><p>Your cart is empty</p></div>
  </div>

  <div id="formAndFooter" style="display:none">
    <div class="form-section">
      <h4>Delivery Details</h4>
      <div class="form-grid">
        <div class="field">
          <label>Full Name *</label>
          <input type="text" id="custName" placeholder="e.g. Amaka Obi">
          <span class="err-msg" id="nameErr">Please enter your name</span>
        </div>
        <div class="field">
          <label>Phone Number *</label>
          <input type="tel" id="custPhone" placeholder="e.g. 08012345678">
          <span class="err-msg" id="phoneErr">Please enter your phone</span>
        </div>
        <div class="field full">
          <label>Delivery Address *</label>
          <input type="text" id="custAddress" placeholder="Street, area, city">
          <span class="err-msg" id="addressErr">Please enter your address</span>
        </div>
        <div class="field full">
          <label>Additional Note (optional)</label>
          <textarea id="custNote" rows="2" placeholder="e.g. Gate colour, landmark..."></textarea>
        </div>
      </div>
    </div>

    <div class="cart-footer">
      <div class="total-row">
        <span class="total-label">Total</span>
        <span class="total-price" id="totalPrice">₦0</span>
      </div>
      <button class="wa-btn" onclick="checkoutWhatsApp()">
        <svg class="wa-icon" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
        Checkout on WhatsApp
      </button>
      <p class="phone-note">you will be redirected to WhatsApp to complete your checkout</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WHATSAPP_NUMBER = "23479013769898";

const products = [
    { id: 1, name: "Beauty Formulas Brightening Vitamin C Facial Toner",  price: 6000, emoji: "🧴", img: "nvl/beauty.jpg"},
    { id: 2, name: "Body Butter Combo",        price:  27000, emoji: "🧴", img: "nvl/Body.jpg"},
    { id: 3, name: "Bright & Clear Face Cream",          price: 7500, emoji: "🧴", img: "nvl/Bright.jpg"},
    { id: 4, name: "Cosmo 10- Niacinamide- Zinc Face Serum",          price: 11000, emoji: "🧴", img: "nvl/Cosmo-10.jpg"     },
    { id: 5, name: "Cosmo Lightening Face Wash",        price: 6500, emoji: "🧴", img: "nvl/Cosmo-Lightening.jpg"   },
    { id: 6, name: "Disaar Body Oil",        price:  6000, emoji: "", img: "nvl/Disaar-Body-Oil.jpg"  },
    { id: 7, name: "Dr Teal's Body Lotion",      price:  13000, emoji: "🧴", img: "nvl/Dr-Teal's-Body-Lotion.jpg"  },
    { id: 8, name: "Dr Teal's Body Wash",      price: 13000, emoji: "🧴", img: "nvl/Dr-Teal's-Body-Wash.jpg"  },
    { id: 9, name: "Dr Teal's Shea Sugar Scrub",  price: 4500, emoji: "🧴", img: "nvl/Dr-Teal's-Shea-Sugar-Scrub.jpg"},
    { id: 10, name: "E45 Lotion",  price: 15000, emoji: "🧴", img: "nvl/E45-Lotion.jpg"},
    { id: 11, name: "Estelin Rosehip Niacinamide Serum",  price: 6500, emoji: "🧴", img: "nvl/Estelin-Rosehip-Niacinamide-Serum.jpg"},
    { id: 12, name: "Estelin Tumeric Vitamin C Brightening Face Serum",        price:  6500, emoji: "🧴", img: "nvl/Estelin-Tumeric-Vitamin-C-Brightening-Face-Serum.jpg"   },
    { id: 13, name: "Facefacts Lactic Acid AHA Serum",          price: 7500, emoji: "🧴", img: "nvl/Facefacts-Lactic-Acid-AHA-Serum.jpg"     },
    { id: 14, name: "Facefacts Niacinamide Serum",          price: 7500, emoji: "🧴", img: "nvl/Facefacts-Niacinamide-Serum.jpg"     },
    { id: 15, name: "Facefacts Polypeptide Serum",        price: 7500, emoji: "🧴", img: "nvl/Facefacts-Polypeptide-Serum.jpg"   },
    { id: 16, name: "Fair & Glow Licorice Root Scrub Shower Gel",        price:  1200, emoji: "🧴", img: "nvl/Fair-&-Glow-Licorice-Root-Scrub-Shower-Gel.jpg"  },
    { id: 17, name: "Mini face routine",      price:  15000, emoji: "🧴", img: "nvl/Mini-face-routine.jpg"  },
    { id: 18, name: "MS Metics Premium Cotton Rounds",      price: 5000, emoji: "🧴", img: "nvl/MS-Metics-Premium-Cotton-Rounds.jpg"  },
    { id: 19, name: "Nivea Body Lotion",  price: 8000, emoji: "🧴", img: "nvl/Nivea-Body-Lotion.jpg"      },
    { id: 20, name: "Nivea Sunscreen",        price:  21000, emoji: "🧴", img: "nvl/Nivea-Sunscreen.jpg"   },
    { id: 21, name: "Oxy 10 Benzoyl Peroxide Lotion",  price: 6500, emoji: "🧴", img: "nvl/Oxy-10-Benzoyl-Peroxide-Lotion.jpg"},
    { id: 22, name: "Simple facial wash",  price: 8000, emoji: "🧴", img: "nvl/Simple-facial-wash.jpg"},
    { id: 23, name: "Simple Hydrating Light Moisturizer",          price: 8000, emoji: "🧴", img: "nvl/Simple-Hydrating-Light-Moisturizer.jpg"     },
    { id: 24, name: "Simple Refreshing Facial Wash",          price: 8000, emoji: "🧴", img: "nvl/Simple-Refreshing-Facial-Wash.jpg"     },
    { id: 25, name: "Skin By Zaron Brightening Toner",        price: 16000, emoji: "🧴", img: "nvl/Skin-By-Zaron-Brightening-Toner.jpg"   },
    { id: 26, name: "Tea Tree Facial Scrub",        price:  6000, emoji: "🧴", img: "nvl/Tea-Tree-Facial-Scrub.jpg"  },
    { id: 27, name: "Tea Tree Foaming Wash",      price:  6000, emoji: "🧴", img: "nvl/Tea-Tree-Foaming-Wash.jpg"  },
    { id: 28, name: "Skin Therapy Oil",      price: 20000, emoji: "🧴", img: "nvl/Skin-Therapy-Oil.jpg"  },
    { id: 30, name: "Vaseline Vitamin B3 Body Oil",  price: 13000, emoji: "🧴", img: "nvl/Vaseline-Vitamin-B3-Body-Oil.jpg"},
    { id: 31, name: "Vaseline Cocoa Radiant Body Oil",  price: 13000, emoji: "🧴", img: "nvl/Vaseline-Cocoa-Radiant-Body-Oil.jpg"      },

  ];

let cart = {};

function renderProducts(){
  document.getElementById('productsGrid').innerHTML = products.map(p=>`
    <div class="product-card">
      <div class="product-img-wrap">
        <div class="fallback-emoji">${p.emoji}</div>
        <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.display='none'" onload="this.previousElementSibling.style.display='none';this.style.display='block'">
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">₦${p.price.toLocaleString()}</div>
        <button class="add-btn" id="btn-${p.id}" onclick="addToCart(${p.id})">Add to Cart</button>
      </div>
    </div>`).join('');
}

function addToCart(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  cart[id] = cart[id] ? {...cart[id], qty: cart[id].qty+1} : {...p, qty:1};
  updateCount(); renderItems();
  const btn = document.getElementById('btn-'+id);
  btn.textContent="Added!"; btn.classList.add('added');
  setTimeout(()=>{btn.textContent="Add to Cart";btn.classList.remove('added');},1300);
  showToast(p.emoji+" "+p.name+" added to cart");
}

function removeFromCart(id){ delete cart[id]; updateCount(); renderItems(); }

function changeQty(id, d){
  if(!cart[id]) return;
  cart[id].qty += d;
  if(cart[id].qty<=0) removeFromCart(id);
  else { updateCount(); renderItems(); }
}

function updateCount(){
  document.getElementById('cartCount').textContent = Object.values(cart).reduce((s,i)=>s+i.qty,0);
}

function renderItems(){
  const body = document.getElementById('cartBody');
  const ff = document.getElementById('formAndFooter');
  const items = Object.values(cart);
  if(!items.length){
    body.innerHTML='<div class="cart-empty"><div class="ei"></div><p>Your cart is empty</p></div>';
    ff.style.display='none'; return;
  }
  const total = items.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('totalPrice').textContent='₦'+total.toLocaleString();
  ff.style.display='block';
  body.innerHTML = items.map(i=>`
    <div class="cart-item">
      <div class="ci-img">
        <img src="${i.img}" alt="${i.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" style="display:block">
        <span style="display:none;font-size:1.5rem">${i.emoji}</span>
      </div>
      <div class="ci-details">
        <div class="ci-name">${i.name}</div>
        <div class="ci-price">₦${i.price.toLocaleString()}</div>
        <div class="qty-row">
          <button class="qty-btn" onclick="changeQty(${i.id},-1)">−</button>
          <span class="qty-num">${i.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i.id},1)">+</button>
          <span style="font-size:12px;color:var(--muted);margin-left:4px">= ₦${(i.price*i.qty).toLocaleString()}</span>
        </div>
      </div>
      <button class="remove-btn" onclick="removeFromCart(${i.id})">✕</button>
    </div>`).join('');
}

function openCart(){ document.getElementById('cartPanel').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeCart(){ document.getElementById('cartPanel').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

function checkoutWhatsApp(){
  const items = Object.values(cart);
  if(!items.length){ showToast("Your cart is empty!"); return; }

  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  const note = document.getElementById('custNote').value.trim();

  let valid = true;
  const show = (id, show) => { document.getElementById(id).style.display = show ? 'block' : 'none'; };
  if(!name){ show('nameErr',true); valid=false; } else show('nameErr',false);
  if(!phone){ show('phoneErr',true); valid=false; } else show('phoneErr',false);
  if(!address){ show('addressErr',true); valid=false; } else show('addressErr',false);
  if(!valid){ showToast("Please fill in your details"); return; }

  const total = items.reduce((s,i)=>s+i.price*i.qty,0);
  let msg = `Hello! I'd like to place an order\n\n`;
  msg += `*Customer Details:*\n`;
  msg += `Name: ${name}\n`;
  msg += `Phone: ${phone}\n`;
  msg += `Address: ${address}\n`;
  if(note) msg += `Note: ${note}\n`;
  msg += `\n*Order Summary:*\n`;
  items.forEach(i=>{ msg += `${i.emoji} ${i.name} x${i.qty} — ₦${(i.price*i.qty).toLocaleString()}\n`; });
  msg += `\n*Total: ₦${total.toLocaleString()}*\n\nPlease confirm my order. Thank you!`;

  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,'_blank');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

renderProducts();
</script>
